# Supabase pauses free projects after 7 days without activity. This runs a tiny
# read query twice a week so the database stays up between pipeline runs.
# Needs the repository secret DATABASE_URL (Settings -> Secrets and variables -> Actions),
# using the Session pooler connection string.
# Note: GitHub turns off scheduled workflows after 60 days with no commits; re-enable it
# from the Actions tab if that happens.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 * * 1,4"  # Monday and Thursday 03:17 UTC (08:47 IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 'alive', count(*), max(date) FROM public.market_data"
