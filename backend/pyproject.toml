[project]
name = "marketmood-backend"
version = "0.1.0"
description = "MarketMood API (FastAPI). Phase 4 builds the endpoints; only health checks exist now."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136,<1",
    "psycopg[binary]>=3.3,<4",
    "python-dotenv>=1.2,<2",
    "uvicorn[standard]>=0.47,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
